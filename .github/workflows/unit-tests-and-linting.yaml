name: Unit Tests & Linting

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7
        with:
          go-version-file: go.mod

      - name: Run unit tests serially with coverage
        run: go test -p 1 -coverprofile=coverage.out -covermode=atomic ./... -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          use_oidc: true
          flags: unit-tests
          files: coverage.out
          fail_ci_if_error: false

      - name: Test health check scripts
        run: |
          test/scripts/test-health-scripts.sh

      - name: Validate AGENTS.md line count
        run: |
          MAX_LINES=300
          ACTUAL_LINES=$(wc -l < AGENTS.md)
          if [ "$ACTUAL_LINES" -gt "$MAX_LINES" ]; then
            echo "::error::AGENTS.md has $ACTUAL_LINES lines, exceeding the $MAX_LINES line limit"
            exit 1
          fi
          echo "AGENTS.md has $ACTUAL_LINES lines (limit: $MAX_LINES)"
